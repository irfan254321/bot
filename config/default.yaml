  background_e_spam: true
  disable_gold_bag_detector: false
  loot_mouse_click_enabled: true
  loot_e_close_dist_px: 85.0
  loot_e_interval_sec: 0.30
  loot_click_interval_sec: 0.30
  loot_max_local_dist_px: 360.0
  loot_close_radius_px: 310
  loot_entry_close_dist_px: 310.0
  loot_entry_kill_window_sec: 4.0
  mandatory_loot_duration_sec: 2.0
  post_kill_loot_window_sec: 10.0
  loot_min_window_sec: 2.0
  loot_empty_exit_sec: 1.2
