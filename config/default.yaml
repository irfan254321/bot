  recovery_duration_sec: 0.85
  # Auto-daylight weather lock via AHK v2 CHAT_CMD (/setweather 11)
  auto_daylight_weather: true
  daylight_weather_cmd: "/setweather 11"
  daylight_weather_interval_sec: 600.0
  daylight_dark_luma_threshold: 68.0
  daylight_dark_cooldown_sec: 45.0
