  return_center_timeout_sec: 6.0
  move_click_interval_sec: 0.55
  move_click_radius_x_ratio: 0.145
  move_click_radius_y_ratio: 0.175
  camera_sweep_interval_sec: 0.85
  camera_sweep_drag_px: 185
