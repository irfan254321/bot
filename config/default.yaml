  # Minimap red blips & cyan facing cone
  minimap_red_hsv_lower_1: [0, 140, 120]
  minimap_red_hsv_upper_1: [10, 255, 255]
  minimap_red_hsv_lower_2: [170, 140, 120]
  minimap_red_hsv_upper_2: [179, 255, 255]
  minimap_cyan_hsv_lower: [82, 95, 140]
  minimap_cyan_hsv_upper: [108, 255, 255]

controls:
  # Single focused mode: Mouse Mode + Auto-ESC guard when Keyboard Mode banner appears
  control_mode: "mouse"
  mode: "mouse"
  auto_restore_mouse_mode: true
  # AutoHotkey v2 persistent input bridge (vm_foreground | host_background)
  input_backend: "ahk"
  ahk_mode: "vm_foreground"
  ahk_script_path: "ahk/vikings_input_bridge.ahk"
  ahk_exe_path: null
  ahk_compiled_exe: null
  ahk_win32_fallback: true
  vm_absolute_mouse: true
  attack_button: "left"
  pickup_key: "e"
  camera_rotate_button: "middle"
  move_forward_key: "w"
  move_back_key: "s"
  strafe_left_key: "a"
  strafe_right_key: "d"
  hp_potion_key: "0"
  hp_potion_threshold: 0.65
  hp_potion_cooldown_sec: 1.5
  weapon_swap_key: "q"
  weapon_min_ea: 130
  weapon_swap_cooldown_sec: 2.5
  mp_potion_key: null
  mp_potion_threshold: 0.30
  mp_potion_cooldown_sec: 2.0
  click_jitter_px: 0
  kb_max_turn_px: 135
  kb_yaw_px_per_deg: 2.5
  humanize: true

farming:
  tick_hz: 20.0
  waypoints_file: "config/waypoints.yaml"
  anchor_spot_on_resume: true
  engage_dist_px: 560
  mob_min_y_ratio: 0.14
