window:
  process_name: "Minia.exe"
  process_aliases: ["Minia.exe", "Login.exe", "Client.exe", "RYL.exe"]
  title_substring: "Vikings"
  title_aliases: ["Vikings", "RYL", "Risk Your Life", "Minia"]
  require_focus: true
  capture_backend: "mss" # mss (VM foreground, <2ms) | printwindow (host background test) | auto
  capture_fps: 25
  black_frame_threshold: 2.0
  black_frame_limit: 15

rois:
  minimap: [0.0026, 0.0046, 0.0573, 0.1065]
  coords: [0.0021, 0.1111, 0.0583, 0.1296]
  hp_bar: [0.0094, 0.9361, 0.0510, 0.9472]
  mp_bar: [0.0625, 0.9361, 0.1036, 0.9472]
  playfield: [0.0450, 0.0556, 0.9750, 0.9450]
  loot_area: [0.1100, 0.1600, 0.9000, 0.7800]
  chat_log: [0.7031, 0.7870, 0.9948, 0.9676]
  ea_stat: [0.0135, 0.9768, 0.0583, 0.9963]
  player_center: [0.50, 0.52]

perception:
  digit_templates_dir: "assets/digit_templates"
  picked_up_template: "assets/ui_templates/picked_up_prefix.png"
  hud_fixed_pixel_ui: false # set true via --vm-1024 for VMware 1024x768 fixed-pixel UI
  interface_mode_roi: [0.12, 0.05, 0.88, 0.22]
  interface_mode_threshold: 0.68
  coord_max_jump: 120.0
  coord_min_confidence: 0.58

  # YOLO11n ONNX Runtime CPU detector (4 classes: 0=gold_rustler, 1=gold_bag, 2=player, 3=dead_rustler)
  yolo_enabled: true
  yolo_model_path: "models/yolo11n_ryl.onnx"
  yolo_imgsz: 640
  yolo_conf_threshold: 0.45
  yolo_iou_threshold: 0.45
  yolo_intra_op_threads: 2

  # Pure OpenCV Gold Rustler nameplate + HP bar + Combat-Status Anti-KS (fallback when ONNX unavailable)
  anti_ks_enabled: true
  anti_ks_player_radius_px: 240
  anti_ks_damage_zone_radius_px: 220
  anti_ks_damage_zone_ttl_sec: 6.0
  anti_ks_min_untouched_hp_ratio: 0.94
  click_y_top_ratio: 0.35
  ks_melee_radius_px: 75.0
  ks_hp_damaged_threshold: 0.94
  lock_iou_threshold: 0.30
  lock_dist_threshold_px: 85.0
  last_kill_loot_radius_px: 140.0
  last_kill_loot_window_sec: 0.80
  gold_nameplate_hsv_lower: [138, 16, 48]
  gold_nameplate_hsv_upper: [179, 215, 255]
  gold_nameplate_wrap_hsv_lower: [0, 26, 58]
  gold_nameplate_wrap_hsv_upper: [6, 95, 110]
  gold_nameplate_min_width: 18
  gold_nameplate_max_width: 160
  gold_nameplate_min_height: 5
  gold_nameplate_max_height: 28
  gold_nameplate_min_pixels: 10
  gold_nameplate_min_fill_ratio: 0.08
  gold_nameplate_max_fill_ratio: 0.78
  gold_nameplate_close_kernel: [14, 3]
  mob_body_max_height_1024: 135
  mob_hp_bar_hsv_lower: [48, 110, 105]
  mob_hp_bar_hsv_upper: [76, 255, 255]
  mob_hp_bar_min_pixels: 10
  player_nameplate_hsv_lower: [48, 90, 155]
  player_nameplate_hsv_upper: [84, 255, 255]

  # Dual-Cue Gold Bag detector (calibrated on ref_gold_scatter.jpg 1024x768)
  loot_glow_hsv_lower: [6, 115, 105]
  loot_glow_hsv_upper: [28, 255, 255]
  loot_dark_body_v_max: 95
  loot_min_dark_ratio: 0.20
  loot_min_blob_pixels: 4
  loot_max_blob_pixels: 140
  loot_pouch_v_max: 48
  loot_pouch_min_area: 36
