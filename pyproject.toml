[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "vikings-bot"
version = "0.2.0"
description = "Vikings Bot v2 — Pure OpenCV CPU + AutoHotkey v2 farming bot for Vikings Online (RYL) in Mouse Mode"
requires-python = ">=3.11"
dependencies = [
    "opencv-python-headless>=4.9",
    "numpy>=1.26",
    "mss>=9.0",
    "PyYAML>=6.0",
    "pywin32>=306",
    "pillow>=10.0",
    "psutil>=5.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
vikings-bot = "vikings_bot.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
